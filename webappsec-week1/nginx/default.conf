map $http_origin $cors_allow_origin {
    default 0;
    "~^https?://(localhost(:[0-9]+)?|127\.0\.0\.1(:[0-9]+)?|waf)$" 1;
}

map $http_origin $allowed_origin {
    default "";
    "~^https?://(localhost(:[0-9]+)?|127\.0\.0\.1(:[0-9]+)?|waf)$" $http_origin;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen ${PORT};
    server_name ${SERVER_NAME};
  
    location = /healthz { return 200; }

    location / {
        # CORS preflight
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization,Content-Type,Accept,Origin" always;
            add_header Access-Control-Max-Age 1728000 always;
            return 204;
        }

        add_header Access-Control-Allow-Credentials $cors_allow_origin always;

        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cross-Origin-Resource-Policy "same-site" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        add_header Content-Security-Policy
            "default-src 'none';
             base-uri 'self';
             frame-ancestors 'self';
             form-action 'self';
             img-src 'self' data:;
             script-src 'self' 'nonce-PLACEHOLDER';
             style-src 'self' 'nonce-PLACEHOLDER';
             font-src 'self';
             connect-src 'self';
             media-src 'none';
             object-src 'none';
             manifest-src 'self';
             frame-src 'none';" always;

        include /etc/nginx/includes/location_common.conf;
        include /etc/nginx/includes/proxy_backend.conf;
    }
}
